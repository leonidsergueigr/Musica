name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev dpkg-dev rpm
      - name: Check tag against project version
        run: |
          version="$(sed -n 's/^project(Musica VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMUSICA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cpack -B packages --config build/CPackConfig.cmake
          mkdir -p release
          cp "packages/musica-$VERSION-Linux.tar.gz" "release/musica-$VERSION-linux-x86_64.tar.gz"
          cp packages/*.deb packages/*.rpm release/
          cd release
          sha256sum * > SHA256SUMS
      - name: Extract release notes
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next }
                               found && /^## \[/ { exit }
                               found && /^\[Unreleased\]/ { exit }
                               found && /^\[[0-9]/ { exit }
                               found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Musica $VERSION" \
            --notes-file release-notes.md
